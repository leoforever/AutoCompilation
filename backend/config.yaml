# 编译平台配置（权威层；.env.compile 同名 env > 本文件 > 代码默认）

database:
  type: postgresql            # postgresql | sqlite
  postgresql:
    host: localhost
    port: 5432
    username: compile_user
    # password 不在此配置（T-9：口令唯 backend/.env.compile 的 DB_PASSWORD，
    # setup.sh rotate-db-password 生成轮换；git 公开仓不养凭据）
    database: compile_platform
  sqlite:
    path: ./cache/compile_platform.db   # 仅 type=sqlite 时生效

jwt:
  # secret_key 不在此配置（C1：密钥唯 backend/.env.compile 的 JWT_SECRET_KEY，
  # setup.sh install 自动生成）；algorithm/expire_minutes 照旧
  algorithm: HS256
  expire_minutes: 1440        # 令牌有效期（24 小时）

compile:
  max_retries: 4              # 编译失败重试上限
  artifact_dir: ./artifacts   # 产物根目录，相对仓库根解析
  clone_attempts: 3           # git clone 失败自动重试次数（外网断流 EOF 属瞬时故障，幂等重来命中率高）
  clone_timeout: 1800         # 单次 clone 硬上限（秒，默认 30min；旧 600s 与实况 981s 不符，改可配）
  clone_low_speed_limit: 1024 # 低速率熔断下限（字节/秒），连续低于则 git 主动断——烂而不死 60s 即败入下一次重试
  clone_low_speed_time: 60    # 低速率熔断持续时长（秒）
  max_active_per_user: 1      # 每用户在途任务上限（submitted+compiling），超限提交 400

worker:                       # 生产主路径 = main.py lifespan worker
  max_workers: 8              # 任务并发数（每 worker 限 32/max_workers 核）
  poll_interval: 5            # 领任务轮询间隔（秒）
  heartbeat_interval: 60      # 任务心跳写库间隔（秒）
  heartbeat_timeout: 1800     # 无心跳看门狗：compiling 停更超此值判 worker 死并回收（秒）
  stale_threshold: 600        # 冻结任务对账阈值（秒）
  sweep_interval: 3600        # 孤儿容器/任务对账周期（秒）

auth:
  allow_self_register: false  # 自助注册开关（env ALLOW_SELF_REGISTER=1 可开）
  reconcile_auto: true        # 对账自愈开关（env RECONCILE_AUTO=0 可关）

llm:                          # LLM 调用治理（2026-11-03；设计档 references/llm-multimodel-throttle-design-20261103.md）
  # 全局限流参数（各模型可用 llm.models 里的同名字段覆盖）
  max_concurrent: 2            # 同时在飞的 LLM HTTP 请求数（worker=8 → 聚合压到 1/4）
  min_interval_ms: 1500        # 相邻请求放行最小间隔（毫秒，预约制实现）
  throttle_retries: 3          # 429 退避重放次数（不含首次）
  throttle_backoff: "30,60,120"  # 阶梯退避秒数；与 Retry-After 取大
  throttle_max_wait: 300       # 单次调用累计等待上限（秒）；超过放弃并报限流
  circuit_threshold: 3         # 连续 N 次限流/失败 → 熔断该模型
  circuit_cooldown: 120        # 熔断持续秒数
  # 模型池（有序=优先级，第一个=主模型；不配则用 AI_MODEL/AI_BASE_URL/AI_API_KEY 造单模型池）
  # 2026-11-03 双模型真开：主 MiniMax（M3.1-Flash）+ 备 Qwen（qwen3.8-flash，跨厂商→配额池独立，
  # 主模型被限流时自动接手）。密钥只存 .env.compile（不入 git），yaml 只引用变量名。
  models:
    - id: minimax-m31
      provider: openai_compatible     # openai_compatible | anthropic | google_genai
      model: MiniMax-M3.1-Flash
      base_url: https://api.minimaxi.com/v1
      api_key_env: AI_API_KEY         # 密钥只走 env，不进 yaml
      enabled: true
      priority: 2
      max_concurrent: 2               # 该模型自己的配额池上限（覆盖全局）
      min_interval_ms: 1500
    - id: qwen-flash
      provider: openai_compatible
      model: qwen3.8-flash
      base_url: https://token-plan.maas.qianwenaiapi.com/compatible-mode/v1
      api_key_env: AI_ALT_API_KEY
      enabled: true
      priority: 1
      max_concurrent: 2
      min_interval_ms: 1500

artifact_cache:                 # 产物复用库（总设计 artifact-reuse-master-design-20261103.md）
  enabled: true                 # 关闭=停止晋升与挂载注入（账本页仍可用）
  promote_kinds: "whl,tgz,rpm,binary,node_binding,so,a"   # 晋升白名单（tool 类走上传通道）
  max_item_mb: 500              # 晋升单件上限
  per_task_promote_mb: 1024     # 单任务晋升总量上限（防整坨倒货）
  upload_max_mb: 2048           # 管理员上传单件上限
  container_work_ttl_days: 7    # P3：中间物自动清龄（拍板：自动删仅限 container_work）
  disk_warn_pct: 85             # 磁盘水位只警不删（11-03 拍板）

stage5:                       # agent 编译阶段闸门
  max_seconds: 10800          # 阶段总墙钟（秒），勿低于 3600：torch 实测 3064s
  max_chunks: 500             # 死循环保险：工具调用 chunk 总量上限
  loop_threshold: 5           # 连续快速失败 N 次判死循环
  loop_window: 5              # "快速失败"判定窗口（秒）
  heartbeat_seconds: 30       # 长静默补"仍在跑"日志的间隔（秒）
  wrapup_enabled: true           # 收尾闸门开关（false=完全关闭）
  wrapup_enforce: false          # false=观测模式（只记不拦）；true=超预算拒答 execute
  post_green_max_seconds: 900    # 全绿后收尾预算（秒）
  post_green_max_execs: 15       # 全绿后 execute 预算（801346 校准：合法 NOTES 期 14 次）

docker_exec:
  timeout: 3600               # 单条容器内命令硬超时（秒），到点 SIGTERM→60s 后 SIGKILL

upload:
  max_size: 2147483648        # 上传大小上限（2GB）

qa:                           # T16 问答台（一次调用+后台 job+SSE，非 agent——设计档 qa-console-design）
  enabled: true               # 总开关（端点 503 人话；数据不出内网要求时一键关）
  max_per_day: 30             # 每用户日限额，账本=当日 qa_ask 审计行数（重启不清零）
  history_rounds: 5           # 会话窗口轮数（超从最老丢，保近弃远）
  ttl_minutes: 30             # 会话空闲过期（分钟）
