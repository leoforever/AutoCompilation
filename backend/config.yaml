# 编译平台配置（权威层；.env.compile 同名 env > 本文件 > 代码默认）

database:
  type: postgresql            # postgresql | sqlite
  postgresql:
    host: localhost
    port: 5432
    username: compile_user
    # password 不在此配置（T-9：口令唯 backend/.env.compile 的 DB_PASSWORD，
    # setup.sh rotate-db-password 生成轮换；git 公开仓不养凭据）
    database: compile_platform
  sqlite:
    path: ./cache/compile_platform.db   # 仅 type=sqlite 时生效

jwt:
  # secret_key 不在此配置（C1：密钥唯 backend/.env.compile 的 JWT_SECRET_KEY，
  # setup.sh install 自动生成）；algorithm/expire_minutes 照旧
  algorithm: HS256
  expire_minutes: 1440        # 令牌有效期（24 小时）

compile:
  max_retries: 4              # 编译失败重试上限
  artifact_dir: ./artifacts   # 产物根目录，相对仓库根解析

worker:                       # 生产主路径 = main.py lifespan worker
  max_workers: 8              # 任务并发数（每 worker 限 32/max_workers 核）
  poll_interval: 5            # 领任务轮询间隔（秒）
  heartbeat_interval: 60      # 任务心跳写库间隔（秒）
  heartbeat_timeout: 1800     # 无心跳看门狗：compiling 停更超此值判 worker 死并回收（秒）
  stale_threshold: 600        # 冻结任务对账阈值（秒）
  sweep_interval: 3600        # 孤儿容器/任务对账周期（秒）

auth:
  allow_self_register: false  # 自助注册开关（env ALLOW_SELF_REGISTER=1 可开）
  reconcile_auto: true        # 对账自愈开关（env RECONCILE_AUTO=0 可关）

stage5:                       # agent 编译阶段闸门
  max_seconds: 10800          # 阶段总墙钟（秒），勿低于 3600：torch 实测 3064s
  max_chunks: 500             # 死循环保险：工具调用 chunk 总量上限
  loop_threshold: 5           # 连续快速失败 N 次判死循环
  loop_window: 5              # "快速失败"判定窗口（秒）
  heartbeat_seconds: 30       # 长静默补"仍在跑"日志的间隔（秒）
  wrapup_enabled: true           # 收尾闸门开关（false=完全关闭）
  wrapup_enforce: false          # false=观测模式（只记不拦）；true=超预算拒答 execute
  post_green_max_seconds: 900    # 全绿后收尾预算（秒）
  post_green_max_execs: 15       # 全绿后 execute 预算（801346 校准：合法 NOTES 期 14 次）

docker_exec:
  timeout: 3600               # 单条容器内命令硬超时（秒），到点 SIGTERM→60s 后 SIGKILL

upload:
  max_size: 2147483648        # 上传大小上限（2GB）
