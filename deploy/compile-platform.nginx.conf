# compile-platform 生产前端（nginx 静态托管 + API/WS 反代）——由 setup.sh 安装到 /etc/nginx/conf.d/
# 端口沿用 3000：用户地址/防火墙零变化。root 指发布目录（/root 下权限链挡 nginx worker）。
server {
    listen 3000;
    server_name _;

    # 平台流量与本机共存服务（openclaw 等）的共用日志物理分离：
    # tail/审计/fail2ban 只喂这两个文件（setup.sh install 重拷后 reload 生效）
    access_log /var/log/nginx/compile-platform-access.log;
    error_log  /var/log/nginx/compile-platform-error.log warn;

    root /srv/compile-platform/dist;
    index index.html;

    # 源码包上传经 /api —— nginx 默认 1m 会 413，与平台上传上限对齐
    client_max_body_size 2048m;

    # 静态资源 miss 不兜 HTML（2026-10-28 审查：SPA fallback 会把任何缺失路径
    # 200 成 index.html——favicon 伪装成功、旧 hash 资源被当脚本解析报 SyntaxError、
    # 监控里资源 404 全失真。资源类请求命中此块，miss 即诚实 404）
    location ~* \.(js|css|png|jpe?g|svg|ico|woff2?|ttf|gif|map)$ {
        try_files $uri =404;
    }
    # 老浏览器无视 <link rel=icon> 直接默认请求 /favicon.ico → 内部转 SVG 资产。
    # 注：try_files 参数是"文件路径"（root 相对/绝对），写 /favicon.svg 当 URI 会
    # 一路 miss 掉进 SPA fallback（本机实测首踩：200 text/html 461B）
    location = /favicon.ico {
        try_files /favicon.svg =404;
    }

    location / {
        try_files $uri $uri/ /index.html;   # SPA history 路由 fallback
    }
    location /assets/ {
        expires 7d;                          # vite 产物带 hash，可长缓存
        add_header Cache-Control "public";
    }
    location = /index.html {
        add_header Cache-Control "no-store"; # 入口不缓存，防旧包引用已删 hash 资源
    }

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;                 # ★ SSE（draft stream/agent stream）必须关缓冲
        proxy_read_timeout 3h;               # LLM 长挂与心跳期不被 60s 掐断
        proxy_send_timeout 3h;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # ★ WS 握手两行
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3h;                        # 编译日志长流
    }
}
