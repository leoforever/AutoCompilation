# compile-platform 生产前端（nginx 静态托管 + API/WS 反代）——由 setup.sh 安装到 /etc/nginx/conf.d/
# 端口沿用 3000：用户地址/防火墙零变化。root 指发布目录（/root 下权限链挡 nginx worker）。
server {
    listen 3000;
    server_name _;

    root /srv/compile-platform/dist;
    index index.html;

    # 源码包上传经 /api —— nginx 默认 1m 会 413，与平台上传上限对齐
    client_max_body_size 2048m;

    location / {
        try_files $uri $uri/ /index.html;   # SPA history 路由 fallback
    }
    location /assets/ {
        expires 7d;                          # vite 产物带 hash，可长缓存
        add_header Cache-Control "public";
    }
    location = /index.html {
        add_header Cache-Control "no-store"; # 入口不缓存，防旧包引用已删 hash 资源
    }

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;                 # ★ SSE（draft stream/agent stream）必须关缓冲
        proxy_read_timeout 3h;               # LLM 长挂与心跳期不被 60s 掐断
        proxy_send_timeout 3h;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;      # ★ WS 握手两行
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3h;                        # 编译日志长流
    }
}
