# compile-platform 公共 location 段——被 HTTPS 正式入口 server 块 include
#（入口端口由 install 按 .env.compile NGINX_HTTPS_PORT 渲染，默认 8443）
# （setup.sh install 拷贝到 /etc/nginx/compile-platform-locations.conf）

# 源码包上传经 /api —— nginx 默认 1m 会 413，与平台上传上限对齐
client_max_body_size 2048m;

# 静态资源 miss 不兜 HTML（2026-10-28 审查：SPA fallback 会把任何缺失路径
# 200 成 index.html——favicon 伪装成功、旧 hash 资源被当脚本解析报 SyntaxError、
# 监控里资源 404 全失真。资源类请求命中此块，miss 即诚实 404）
location ~* \.(js|css|png|jpe?g|svg|ico|woff2?|ttf|gif|map)$ {
    try_files $uri =404;
}
# 老浏览器无视 <link rel=icon> 直接默认请求 /favicon.ico → 内部转 SVG 资产。
# 注：try_files 参数是"文件路径"（root 相对/绝对），写 /favicon.svg 当 URI 会
# 一路 miss 掉进 SPA fallback（本机实测首踩：200 text/html 461B）
location = /favicon.ico {
    try_files /favicon.svg =404;
}

# 纯文本资产（/disclaimer.txt 等）：HTTP 规定 text/plain 无 charset 时默认按
# Latin-1 解读、中文 Windows 浏览器猜 GBK → UTF-8 文件直链打开全是乱码（11-11 实案）。
# txt 不在上面资源类 location 的正则里，会落 SPA fallback 变乱码 HTML——此处显式拦截
location = /disclaimer.txt {
    charset utf-8;
    default_type "text/plain; charset=utf-8";
    add_header Cache-Control "no-store";   # 声明改版即时可见（文件极小，不缓存无损）
    try_files /disclaimer.txt =404;
}

location / {
    try_files $uri $uri/ /index.html;   # SPA history 路由 fallback
}
location /assets/ {
    expires 7d;                          # vite 产物带 hash，可长缓存
    add_header Cache-Control "public";
}
location = /index.html {
    add_header Cache-Control "no-store"; # 入口不缓存，防旧包引用已删 hash 资源
}

location /api {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;   # HTTPS 方案 §二-1（后端将来区分协议用）
    proxy_buffering off;                 # ★ SSE（draft stream/agent stream）必须关缓冲
    proxy_read_timeout 3h;               # LLM 长挂与心跳期不被 60s 掐断
    proxy_send_timeout 3h;
}

location /ws {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # ★ WS 握手两行
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3h;                        # 编译日志长流
}
