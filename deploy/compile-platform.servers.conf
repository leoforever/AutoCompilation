# compile-platform server 块（由 setup.sh install 拷贝到 /etc/nginx/compile-platform-servers.conf，
# 主 conf 经 compile-platform-managed 标记行 include）。
# 3000=HTTP 过渡期原样可用；8443=HTTPS 正式入口。两 server 共用 locations.conf 路由段。
# 8443 与 k8s api 曾有历史关联（现实测空闲）；若日后撞车，改 8444 只需动本文件两处。

server {
    listen 3000;
    server_name _;

    access_log /var/log/nginx/compile-platform-access.log;
    error_log  /var/log/nginx/compile-platform-error.log warn;

    # 2026-10-29 收口：3000 全量 301→8443。唯一例外=CA 分发仍走明文——
    # 没装证书的人下证书不该先进"红叉页"（先有鸡先有蛋死锁）
    location = /platform-ca.crt {
        allow 10.40.65.0/24; allow 192.168.4.0/24; allow 127.0.0.1; deny all;
        alias /etc/nginx/ssl/platform-ca.crt;
        types { } default_type application/x-x509-ca-cert;
    }
    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    # HTTPS 正式入口（证书两段式见 deploy/gen-certs.sh；SAN=机器当前 IP，换 IP 重跑 install 自愈）
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/compile-platform.crt;
    ssl_certificate_key /etc/nginx/ssl/compile-platform.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CPSSL:8m;
    ssl_session_timeout 1h;

    access_log /var/log/nginx/compile-platform-access.log;
    error_log  /var/log/nginx/compile-platform-error.log warn;

    root /srv/compile-platform/dist;
    index index.html;

    # CA 分发（HTTPS 方案 §二-5 命门）：仅限内网段拉取，公网口不放
    location = /platform-ca.crt {
        allow 10.40.65.0/24; allow 192.168.4.0/24; allow 127.0.0.1; deny all;
        alias /etc/nginx/ssl/platform-ca.crt;
        types { } default_type application/x-x509-ca-cert;
    }

    include /etc/nginx/compile-platform-locations.conf;
}

server {
    # 8080 明文口仅做跳转（记不起端口号的内网老用户便利，零安全损失——无数据过路）
    listen 8080;
    server_name _;
    return 301 https://$host:8443$request_uri;
}
